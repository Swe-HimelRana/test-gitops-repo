name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA::7}"

          # Convert branch name to a valid Docker tag
          BRANCH_TAG=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')

          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$BRANCH_TAG-$SHA" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/landing-page:${{ steps.meta.outputs.branch_tag }} \
            -t ghcr.io/${{ github.repository_owner }}/landing-page:${{ steps.meta.outputs.sha_tag }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/landing-page:${{ steps.meta.outputs.branch_tag }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/landing-page:${{ steps.meta.outputs.sha_tag }}
